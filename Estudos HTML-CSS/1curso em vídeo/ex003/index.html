<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Imagens</title>
</head>
<body>
    <h1>Testando carga e imagens</h1>
        <p>Abaixo você vai ver uma imagem que está na mesma pasta:</p>
        <img src="logo HTML5 200.jpg" alt="Logo HTML5">
        <p>Podemos também carregar imagens que estão em subpastas:</p>
        <img src="imagens/logo CSS 200.png" alt="Logo CSS3">
        <p>E também podemos carregar imagens externas através de links URL:</p>
        <img src="https://static.wikia.nocookie.net/coding-help/images/6/69/JavaScript.png/revision/latest/thumbnail/width/360/height/360?cb=20230517123229" alt="Logo JavaScript">
</body>
</html>
