<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo Classes</title>
    <style>
        div{
            display: inline-block;
            background-color: lightgray;
            width: 100px;
            height: 100px;
            border: 1px solid;
            text-align: center;
        }

        div:hover{
            background-color: yellow;
            transition: 0.3s all;
        }
    </style>
</head>
<body>
    <div>Div 1<p>Passe o cursor!</p></div>
    <div>Div 2<p>Passe o cursor!</p></div>
    <div>Div 3<p>Passe o cursor!</p></div>
</body>
</html>
